# 발헤임 데디케이티드 서버 (집 PC 자가 호스팅)
#
# 실행:  cd server && docker compose up -d
# 로그:  docker compose logs -f
# 중지:  docker compose stop
#
# 월드 데이터는 명명 볼륨(valheim-config)에 둔다.
# Windows 폴더를 직접 마운트하면 WSL2 경유로 느리고, 컨테이너가 chown 을
# 수행하지 못해 권한 문제가 반복된다. 백업만 Windows 쪽으로 내보낸다.

services:
  valheim:
    image: ghcr.io/lloesche/valheim-server:latest
    container_name: valheim
    restart: unless-stopped

    # 월드 저장이 끝날 시간을 준다. 이 값이 짧으면 종료 중 월드가 손상될 수 있다.
    stop_grace_period: 2m

    cap_add:
      - sys_nice

    # 서버를 논리코어 0-3(물리 2개)에만 올린다.
    #
    # 이 PC 는 6코어 12스레드인데 방장이 같은 PC 에서 게임을 한다. 둘이
    # 같은 코어를 두고 다투면 여러 명이 모였을 때 서버 틱이 흔들리고,
    # 접속한 전원이 끊김과 타격 판정 이상을 겪는다. 그래서 갈라 놓는다.
    #
    # 어디서 자를지는 재어서 정했다. 8명이 들어와 있을 때 게임 서버
    # 프로세스는 코어 0.24 개, 메인 스레드 16% 밖에 쓰지 않았다. 처음에
    # 반씩(0-5) 준 것은 지나쳤고, 그만큼 클라이언트가 3 물리코어에 갇혀
    # 몹이 나올 때 프레임이 밀렸다. 서버에 2 물리코어만 남기고 나머지를
    # 넘긴다.
    #
    # 게임과 Discord 는 반대편(4-11)으로 보내야 완전히 갈라진다.
    # 그쪽은 Windows 프로세스라 scripts/pin-client.ps1 이 맡는다.
    cpuset: "0-3"

    ports:
      # 2456 = 게임 접속, 2457 = Steam 쿼리. 둘 다 UDP 다.
      - "2456:2456/udp"
      - "2457:2457/udp"

    volumes:
      - valheim-config:/config
      # 백업은 Windows 쪽에서 바로 확인할 수 있도록 내보낸다.
      # 시간당 1회 zip 쓰기라 바인드 마운트 속도가 문제되지 않는다.
      - ${BACKUP_HOST_DIR:-./backups}:/backups-out

    env_file:
      - .env

    environment:
      SERVER_PORT: "2456"

      # Steam 서버 목록에 등록한다. 접속 인원 조회(status.json)에도 필요하다.
      # 비밀번호 보호는 그대로 유지된다.
      SERVER_PUBLIC: "true"

      # 크로스플레이는 켜지 않는다. BepInEx 는 Steam 네트워킹에 후킹하므로
      # PlayFab 네트워킹과 양립하지 않는다. 인자를 주지 않는 것이 곧 비활성이다.

      # 자동 업데이트 금지.
      # 게임이나 BepInEx 가 무인 상태에서 올라가면 모드 스택이 깨져
      # 아무도 접속하지 못하게 된다. 업데이트는 사람이 판단해서 수행한다.
      UPDATE_CRON: ""
      BEPINEX_UPDATE_CRON: ""

      # 백업. 컨테이너가 직접 Windows 쪽 디렉터리에 쓴다.
      #
      # 6시간마다 한다. 원래 매시간이었는데, 발헤임이 스스로 8시간마다
      # 백업을 뜨고 30분마다 세이브도 하므로 그 위에 시간당 한 번씩
      # 월드를 통째로 압축할 이유가 없었다. 서버와 게임이 CPU 를 두고
      # 다투는 상황이라 쓸데없는 일은 덜어 둔다.
      BACKUPS: "true"
      BACKUPS_DIRECTORY: "/backups-out"
      BACKUPS_CRON: "5 */6 * * *"
      BACKUPS_MAX_AGE: "7"
      BACKUPS_ZIP: "true"

      # 접속 인원 조회용 상태 HTTP. 호스트에 포트를 노출하지 않으므로
      # 컨테이너 내부에서만 읽을 수 있다.
      STATUS_HTTP: "true"

      # 바닐라 안정화(친구 실접속 확인)를 마친 뒤 켰다.
      # 모드 파일은 /config/bepinex/plugins 에 둔다.
      BEPINEX: "true"

      # BepInEx 패처 DLL 설치.
      #
      # 이미지는 /config/bepinex/plugins 만 BepInEx/plugins 로 동기화하고
      # patchers 디렉터리는 다루지 않는다. 그런데 ServersideQoL 같은 모드는
      # patchers 에 DLL 이 있어야 초기화된다. 없으면 플러그인은 로드되지만
      # config 조차 생성하지 못하고 기능이 전부 죽는다.
      #
      # 이미지가 매 기동마다 /opt/valheim/bepinex 트리를 새로 만들고
      # 헌 트리를 bepinex.old 로 밀어내며 교체한다. 그래서
      #   - 그 안에 볼륨을 마운트하면 교체 시 고아가 된다 (device busy)
      #   - POST_BEPINEX_CONFIG_HOOK 은 교체보다 먼저라 복사분이 지워진다
      # 실측으로 확인한 사실이다. 서버 시작 직전에 도는 PRE_START_HOOK 에서
      # 복사해야 살아남는다. 두 훅을 모두 걸어 어느 경로로 기동하든 덮는다.
      POST_BEPINEX_CONFIG_HOOK: >-
        mkdir -p /opt/valheim/bepinex/BepInEx/patchers;
        cp -f /config/bepinex/patchers/*.dll /opt/valheim/bepinex/BepInEx/patchers/ 2>/dev/null || true

      PRE_START_HOOK: >-
        mkdir -p /opt/valheim/bepinex/BepInEx/patchers;
        cp -f /config/bepinex/patchers/*.dll /opt/valheim/bepinex/BepInEx/patchers/ 2>/dev/null;
        chown -R 1000:1000 /opt/valheim/bepinex/BepInEx/patchers 2>/dev/null;
        echo "PATCHERS:"; ls -la /opt/valheim/bepinex/BepInEx/patchers/ || true

      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Seoul"

volumes:
  valheim-config:
    name: valheim-config
  valheim-patchers:
    name: valheim-patchers
