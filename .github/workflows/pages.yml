name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 루트 의존성 설치
        run: npm ci

      - name: web 의존성 설치
        working-directory: web
        run: npm ci

      # 루트와 web 은 각자 package.json 과 vitest 를 따로 가진 별도
      # 프로젝트다(메이저 버전도 다르다: 루트 vitest 2.x, web vitest 5.x).
      # 루트 vitest.config.mjs 가 tests/** 로 스코프를 명시해 두었으므로,
      # 두 단계를 각각 실행해야 각 프로젝트가 자기 테스트를 자기 vitest
      # 버전으로 검증한다. 하나로 합치면(예: 루트에서 npm test 한 번)
      # 스코프 설정이 나중에 바뀔 때 web 테스트가 조용히 덜 돌게 되는
      # 위험이 생긴다.
      - name: 테스트 (루트)
        run: npm test

      - name: 테스트 (web)
        working-directory: web
        run: npm test

      # mods.json 스키마는 astro.config.mjs 가 빌드 시작 전에 검증한다.
      # 잘못된 모드 정보가 배포되면 친구들이 틀린 안내를 보게 된다.
      - name: 빌드
        working-directory: web
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
